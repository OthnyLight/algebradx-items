# AlgebraDx Open Diagnostic Item Bank v1.0 (grades 9-12, algebra readiness)
# Source of truth. Exports, forms and the teacher guide are generated from this file.
# All items are original. No NAEP or TIMSS item text is reproduced.
# Drafted with AI assistance; every item reviewed and verified by the author (v1.0.0, 2026-10-10).
#
# Fields
#   id, strand, skill, ccss (codes), naep_focus (descriptive; mapped to framework IDs in
#   docs/NAEP_ALIGNMENT.csv), difficulty (hypothesized 1 easy - 3 hard; to be replaced by
#   local calibration), stem, options {A-D: {text, math}}, key, distractors {letter: {code, reveals}},
#   teaching_move (item-level summary; full moves per code in misconceptions.yaml), check.
#
# check types (run by code/02_validate.py; exact rational arithmetic, no dependencies)
#   value          options' math are numbers; key equals answer, distractors don't
#   expr           options' math are expressions; key equivalent to target, distractors not
#   equiv_solution options are linear equations; key has the same solution as original
#   solves         options are numbers; key satisfies the equation, distractors don't
#   ineq           options are inequalities; key has the same solution set as original
#   literal        options are expressions for solve_for; key satisfies the equation identically
#   table          options are right-hand sides y = f(x); key fits every point
#   relation       options are relations; key true at every scenario, distractors false at one
#   assert         per-option truth expressions; key True, distractors False
# Any option with math: null is reviewed by hand (listed in the QA report).

items:

# ---------------------------------------------------------------- EQ: Equality and equivalence
- id: EQ01
  strand: EQ
  skill: Recognize equations that are equivalent to a given linear equation
  ccss: [A-REI.A.1, 8.EE.C.7]
  naep_focus: equations and inequalities - equivalent forms
  difficulty: 1
  stem: "Without solving, which equation has the same solution as 3x + 7 = 22?"
  options:
    A: {text: "3x = 15", math: "3*x == 15"}
    B: {text: "3x = 29", math: "3*x == 29"}
    C: {text: "x + 7 = 19", math: "x + 7 == 19"}
    D: {text: "3x + 7 = 15", math: "3*x + 7 == 15"}
  key: A
  distractors:
    B: {code: EQ-TRANSPOSE, reveals: "Moved +7 to the right side without changing its sign (22 + 7)."}
    C: {code: VAR-COEF-ADD, reveals: "Read 3x as 3 + x and 'removed' the 3 by subtracting it from 22."}
    D: {code: EQ-ONESIDE, reveals: "Subtracted 7 from the right side only, leaving +7 on the left."}
  teaching_move: "Have students substitute x = 5 into each choice; an equation is equivalent only if the same value still makes it true. Then name the both-sides operation that produced the correct one."
  check: {type: equiv_solution, var: x, original: "3*x + 7 == 22"}

- id: EQ02
  strand: EQ
  skill: Use the equal sign relationally (compare structure without computing)
  ccss: [A-SSE.A.2, 6.EE.A.4]
  naep_focus: variables, expressions and operations - equivalence and structure
  difficulty: 1
  stem: "Without adding, decide whether this statement is true or false: 47 + 38 = 48 + 37."
  options:
    A: {text: "False, because the numbers on the two sides are different.", math: null}
    B: {text: "False, because 47 + 38 = 85, and 85 is not 48.", math: null}
    C: {text: "True, because 48 is one more than 47 and 37 is one less than 38.", math: null}
    D: {text: "You cannot tell without computing both sides.", math: null}
  key: C
  distractors:
    A: {code: VAR-SURFACE, reveals: "Judges equality by whether the symbols match rather than whether the values match."}
    B: {code: EQ-OP, reveals: "Reads '=' as 'the answer is next' and treats 48 as the result of 47 + 38."}
    D: {code: EQ-OP, reveals: "Can verify only by computing; does not yet use structure (compensation) to reason about equality."}
  teaching_move: "Run a short true/false number-sentence routine (5 minutes, daily for a week) in which every statement must be justified without computing."
  check:
    type: assert
    truths:
      C: "47 + 38 == 48 + 37 and 48 == 47 + 1 and 37 == 38 - 1"
      A: "47 + 38 != 48 + 37"
      B: "47 + 38 != 48 + 37"

- id: EQ03
  strand: EQ
  skill: Choose a valid first step that preserves equality
  ccss: [A-REI.A.1, A-REI.B.3]
  naep_focus: equations and inequalities - solving linear equations
  difficulty: 2
  stem: "Which of these is a correct first step for solving 4x - 8 = 12?"
  options:
    A: {text: "x - 8 = 3", math: "x - 8 == 3"}
    B: {text: "x - 2 = 3", math: "x - 2 == 3"}
    C: {text: "4x = 4", math: "4*x == 4"}
    D: {text: "x - 8 = 12", math: "x - 8 == 12"}
  key: B
  distractors:
    A: {code: EQ-ONESIDE, reveals: "Divided 4x and 12 by 4 but not the 8; division is applied to the most visible terms, not to whole sides."}
    C: {code: EQ-TRANSPOSE, reveals: "Moved -8 across as -8 (12 - 8) instead of adding 8 to both sides."}
    D: {code: EQ-ONESIDE, reveals: "Divided only the x-term by 4, so 'getting x alone' was done to one term."}
  teaching_move: "Require a substitution check after each step: x = 5 solves the original, so it must solve every correct next line."
  check: {type: equiv_solution, var: x, original: "4*x - 8 == 12"}

- id: EQ04
  strand: EQ
  skill: Collect variable terms from both sides of an equation
  ccss: [A-REI.B.3, 8.EE.C.7b]
  naep_focus: equations and inequalities - solving linear equations
  difficulty: 2
  stem: "Which equation is a correct next step for solving 5x + 3 = 2x + 15?"
  options:
    A: {text: "7x + 3 = 15", math: "7*x + 3 == 15"}
    B: {text: "5x + 3 = 17x", math: "5*x + 3 == 17*x"}
    C: {text: "5x = 2x + 18", math: "5*x == 2*x + 18"}
    D: {text: "3x + 3 = 15", math: "3*x + 3 == 15"}
  key: D
  distractors:
    A: {code: EQ-TRANSPOSE, reveals: "Moved 2x to the left keeping its sign, so the x-terms were added instead of subtracted."}
    B: {code: VAR-CONJOIN, reveals: "Combined 2x + 15 into 17x, treating unlike terms as combinable."}
    C: {code: EQ-TRANSPOSE, reveals: "Moved +3 to the right keeping its sign (15 + 3)."}
  teaching_move: "Write the both-sides operation above each step (-2x on each side) and contrast with the 'move it' versions in a correct/incorrect worked-example pair."
  check: {type: equiv_solution, var: x, original: "5*x + 3 == 2*x + 15"}

- id: EQ05
  strand: EQ
  skill: Interpret an identity (infinitely many solutions)
  ccss: [A-REI.A.1, 8.EE.C.7a]
  naep_focus: equations and inequalities - number of solutions
  difficulty: 3
  stem: "For which values of x is 2(x + 3) = 2x + 6 true?"
  options:
    A: {text: "Only x = 0", math: null}
    B: {text: "No values, because the x-terms cancel", math: null}
    C: {text: "Every real number", math: null}
    D: {text: "Only x = -3", math: null}
  key: C
  distractors:
    A: {code: EQ-UNIQUE, reveals: "Tested one convenient value and stopped, expecting exactly one solution."}
    B: {code: EQ-UNIQUE, reveals: "Reached 6 = 6 (or 0 = 0) and read the disappearance of x as 'no solution'."}
    D: {code: EQ-UNIQUE, reveals: "Looked for a single 'special' value by setting the parentheses to zero."}
  teaching_move: "Substitute several values (0, 1, 10, -3) and record the results in a table; then sort a set of equations into one / none / infinitely many solutions."
  check:
    type: assert
    truths:
      C: "ident('2*(x+3)', '2*x+6', ['x'])"

# ---------------------------------------------------------------- VAR: Variables and expressions
- id: VAR01
  strand: VAR
  skill: Evaluate an expression with a coefficient by substitution
  ccss: [6.EE.A.2c, A-SSE.A.1]
  naep_focus: variables, expressions and operations - evaluating expressions
  difficulty: 1
  stem: "If x = 6, what is the value of 4x - x?"
  options:
    A: {text: "4", math: "4"}
    B: {text: "18", math: "18"}
    C: {text: "40", math: "40"}
    D: {text: "3", math: "3"}
  key: B
  distractors:
    A: {code: VAR-NOT-NUMBER, reveals: "Treated '- x' as deleting the letter, leaving 4; x is not acting as a quantity."}
    C: {code: VAR-CONCAT, reveals: "Read 4x with x = 6 as the two-digit number 46, then subtracted 6."}
    D: {code: VAR-NOT-NUMBER, reveals: "Simplified to 3x and then dropped the x (or treated it as 1)."}
  teaching_move: "Write the multiplication sign during substitution (4 · 6 - 6), then fade it; read 4x - x aloud as 'four of x, take away one of x'."
  check: {type: value, answer: "4*x - x", at: {x: 6}}

- id: VAR02
  strand: VAR
  skill: Combine like terms
  ccss: [7.EE.A.1, A-SSE.A.2]
  naep_focus: variables, expressions and operations - equivalent expressions
  difficulty: 1
  stem: "Which expression is equivalent to 3x + 2 + 5x?"
  options:
    A: {text: "8x + 2", math: "8*x + 2"}
    B: {text: "10x", math: "10*x"}
    C: {text: "15x + 2", math: "15*x + 2"}
    D: {text: "8x² + 2", math: "8*x**2 + 2"}
  key: A
  distractors:
    B: {code: VAR-CONJOIN, reveals: "Added every number and attached one x; expects a single-term answer."}
    C: {code: LIKE-TERMS-OP, reveals: "Multiplied the coefficients 3 and 5 when combining like terms."}
    D: {code: LIKE-TERMS-OP, reveals: "Treated x + x as x², mixing the rules for adding and multiplying terms."}
  teaching_move: "Evaluate the original and each choice at x = 10: equivalent expressions give equal values for every x."
  check: {type: expr, vars: [x], target: "3*x + 2 + 5*x"}

- id: VAR03
  strand: VAR
  skill: Understand that different letters may take equal values
  ccss: [6.EE.A.2, A-SSE.A.1]
  naep_focus: variables, expressions and operations - meaning of variables
  difficulty: 2
  stem: "Is a + b + c = a + p + c always true, never true, or sometimes true?"
  options:
    A: {text: "Always true", math: null}
    B: {text: "Never true, because b and p are different letters", math: null}
    C: {text: "Sometimes true, when b = p", math: null}
    D: {text: "Never true, because there are no numbers to check", math: null}
  key: C
  distractors:
    A: {code: VAR-SURFACE, reveals: "Matched the a's and c's on both sides and stopped looking."}
    B: {code: VAR-DIFFERENT, reveals: "Believes different letters must stand for different numbers."}
    D: {code: VAR-NOT-NUMBER, reveals: "Does not see letters as standing for numbers that can be tested."}
  teaching_move: "Ask for values that make it true and values that make it false; establish the 'always / sometimes / never, with an example' routine."
  check:
    type: assert
    truths:
      C: "sometimes('a+b+c', 'a+p+c', ['a','b','c','p'])"
      A: "always('a+b+c', 'a+p+c', ['a','b','c','p'])"
      B: "never('a+b+c', 'a+p+c', ['a','b','c','p'])"

- id: VAR04
  strand: VAR
  skill: Represent a general property (evenness) with an expression
  ccss: [A-SSE.A.1, A-CED.A.1]
  naep_focus: algebraic representations - expressions for general quantities
  difficulty: 2
  stem: "n can be any whole number. Which expression is ALWAYS an even number?"
  options:
    A: {text: "n + 2", math: null}
    B: {text: "e", math: null}
    C: {text: "2n + 1", math: null}
    D: {text: "2n", math: null}
  key: D
  distractors:
    A: {code: VAR-SPECIFIC, reveals: "Checked one even value of n (such as 2) and generalized."}
    B: {code: VAR-LABEL, reveals: "Used the letter as an abbreviation for the property 'even'."}
    C: {code: VAR-SURFACE, reveals: "Saw the 2 and concluded 'even' without reasoning about the + 1."}
  teaching_move: "Counterexample hunt: for each choice, find a whole number n that makes it odd. Then ask why no such n exists for 2n."
  check:
    type: assert
    truths:
      D: "all_int(lambda n: (2*n) % 2 == 0)"
      A: "all_int(lambda n: (n + 2) % 2 == 0)"
      C: "all_int(lambda n: (2*n + 1) % 2 == 0)"

- id: VAR05
  strand: VAR
  skill: Compare expressions over all values of the variable
  ccss: [A-SSE.A.1, A-REI.D.11]
  naep_focus: variables, expressions and operations - comparing expressions
  difficulty: 3
  stem: "Which is larger, 2n or n + 2?"
  options:
    A: {text: "2n, because multiplying makes a number bigger", math: null}
    B: {text: "They are equal", math: null}
    C: {text: "n + 2, because adding 2 always gives more", math: null}
    D: {text: "It depends on the value of n", math: null}
  key: D
  distractors:
    A: {code: VAR-SURFACE, reveals: "Applies 'multiplication makes bigger' without testing small or negative values."}
    B: {code: VAR-SPECIFIC, reveals: "Tested n = 2, where they are equal, and generalized."}
    C: {code: VAR-SPECIFIC, reveals: "Tested a small value such as n = 1 and generalized."}
  teaching_move: "Table of values for n = -2, 0, 1, 2, 3, 10; graph both expressions and locate where they cross."
  check:
    type: assert
    truths:
      D: "not all_num(lambda n: 2*n > n + 2) and not all_num(lambda n: n + 2 > 2*n)"
      A: "all_num(lambda n: 2*n > n + 2)"
      B: "all_num(lambda n: 2*n == n + 2)"
      C: "all_num(lambda n: n + 2 > 2*n)"

# ---------------------------------------------------------------- DIST: Distributive property and factoring
- id: DIST01
  strand: DIST
  skill: Apply the distributive property to a binomial
  ccss: [7.EE.A.1, A-SSE.A.2]
  naep_focus: variables, expressions and operations - equivalent expressions
  difficulty: 1
  stem: "Which expression is equivalent to 4(x + 3)?"
  options:
    A: {text: "4x + 3", math: "4*x + 3"}
    B: {text: "4x + 7", math: "4*x + 7"}
    C: {text: "4x + 12", math: "4*x + 12"}
    D: {text: "12x", math: "12*x"}
  key: C
  distractors:
    A: {code: DIST-FIRST, reveals: "Multiplied only the first term inside the parentheses."}
    B: {code: DIST-ADD, reveals: "Added the 4 to the 3 instead of multiplying."}
    D: {code: VAR-CONJOIN, reveals: "Multiplied the numbers and attached the x, producing a single term."}
  teaching_move: "Area model: a 4 by (x + 3) rectangle has two regions, 4x and 12. Then 'four groups of (x + 3)' written out once."
  check: {type: expr, vars: [x], target: "4*(x + 3)"}

- id: DIST02
  strand: DIST
  skill: Subtract a binomial (distribute a negative)
  ccss: [7.EE.A.1, A-APR.A.1]
  naep_focus: variables, expressions and operations - operations with expressions
  difficulty: 2
  stem: "Which expression is equivalent to 10 - (x - 3)?"
  options:
    A: {text: "13 - x", math: "13 - x"}
    B: {text: "7 - x", math: "7 - x"}
    C: {text: "13 + x", math: "13 + x"}
    D: {text: "x - 13", math: "x - 13"}
  key: A
  distractors:
    B: {code: DIST-NEG, reveals: "Dropped the parentheses without changing the sign of -3."}
    C: {code: DIST-NEG, reveals: "Changed the sign of the last term only; the negative was not distributed to x."}
    D: {code: SIGN-SUB, reveals: "Treated subtraction as if order did not matter, reversing the whole difference."}
  teaching_move: "Rewrite as 10 + (-1)(x - 3) and distribute; check with x = 0 (the original gives 13)."
  check: {type: expr, vars: [x], target: "10 - (x - 3)"}

- id: DIST03
  strand: DIST
  skill: Square a binomial
  ccss: [A-APR.A.1, A-SSE.A.2]
  naep_focus: variables, expressions and operations - polynomial operations
  difficulty: 2
  stem: "Which expression is equivalent to (x + 5)²?"
  options:
    A: {text: "x² + 25", math: "x**2 + 25"}
    B: {text: "x² + 10x + 25", math: "x**2 + 10*x + 25"}
    C: {text: "x² + 5x + 25", math: "x**2 + 5*x + 25"}
    D: {text: "2x + 10", math: "2*x + 10"}
  key: B
  distractors:
    A: {code: DIST-SQUARE, reveals: "Squared each term separately, extending distribution to exponents."}
    C: {code: DIST-PARTIAL, reveals: "Knows there is a middle term but recorded only one of the two cross products."}
    D: {code: EXP-MULT, reveals: "Read 'squared' as 'times 2'."}
  teaching_move: "Draw the square with side x + 5 and label all four regions; numeric check: (3 + 5)² = 64, but 3² + 5² = 34."
  check: {type: expr, vars: [x], target: "(x + 5)**2"}

- id: DIST04
  strand: DIST
  skill: Simplify a rational expression by factoring before cancelling
  ccss: [A-SSE.A.2, A-APR.D.6]
  naep_focus: variables, expressions and operations - equivalent expressions
  difficulty: 2
  stem: "Which expression is equivalent to (3x + 6) / 3?"
  options:
    A: {text: "x + 6", math: "x + 6"}
    B: {text: "3x + 2", math: "3*x + 2"}
    C: {text: "3x", math: "3*x"}
    D: {text: "x + 2", math: "x + 2"}
  key: D
  distractors:
    A: {code: DIST-CANCEL, reveals: "Cancelled the 3 in 3x with the denominator, leaving the 6 untouched."}
    B: {code: DIST-FIRST, reveals: "Divided only the constant term by 3."}
    C: {code: VAR-CONJOIN, reveals: "Combined 3x + 6 into 9x, then divided."}
  teaching_move: "Factor first, then cancel: 3(x + 2) / 3. Check at x = 1: the original gives 3."
  check: {type: expr, vars: [x], target: "(3*x + 6) / 3"}

- id: DIST05
  strand: DIST
  skill: Factor a difference of squares
  ccss: [A-SSE.A.2, A-SSE.B.3a]
  naep_focus: variables, expressions and operations - factoring
  difficulty: 3
  stem: "Which expression is a factored form of x² - 9?"
  options:
    A: {text: "(x - 3)²", math: "(x - 3)**2"}
    B: {text: "(x - 3)(x + 3)", math: "(x - 3)*(x + 3)"}
    C: {text: "(x - 9)(x + 1)", math: "(x - 9)*(x + 1)"}
    D: {text: "x(x - 9)", math: "x*(x - 9)"}
  key: B
  distractors:
    A: {code: FACT-SQUARE, reveals: "Matched the shape 'x² and 9' to a perfect square without checking the middle term."}
    C: {code: FACT-SUM-PRODUCT, reveals: "Found factors of -9 without matching the x-coefficient (zero)."}
    D: {code: FACT-COMMON, reveals: "Factored out x as if every term contained x."}
  teaching_move: "Multiply back every factorization; contrast x² - 9 with x² - 6x + 9 side by side."
  check: {type: expr, vars: [x], target: "x**2 - 9"}

# ---------------------------------------------------------------- LIN: Linear equations and inequalities
- id: LIN01
  strand: LIN
  skill: Solve a linear equation with a negative coefficient
  ccss: [A-REI.B.3, 8.EE.C.7b]
  naep_focus: equations and inequalities - solving linear equations
  difficulty: 1
  stem: "Solve 7 - 2x = 15."
  options:
    A: {text: "x = 4", math: "4"}
    B: {text: "x = -11", math: "-11"}
    C: {text: "x = 3", math: "3"}
    D: {text: "x = -4", math: "-4"}
  key: D
  distractors:
    A: {code: SIGN-DROP, reveals: "Reached -2x = 8 and divided by 2 instead of -2."}
    B: {code: EQ-TRANSPOSE, reveals: "Moved 7 across keeping its sign (-2x = 22)."}
    C: {code: VAR-CONJOIN, reveals: "Combined 7 - 2x into 5x."}
  teaching_move: "Circle each term with its sign before solving; finish every solution with a substitution check in the original."
  check: {type: solves, var: x, equation: "7 - 2*x == 15"}

- id: LIN02
  strand: LIN
  skill: Solve a linear inequality requiring division by a negative
  ccss: [A-REI.B.3]
  naep_focus: equations and inequalities - solving linear inequalities
  difficulty: 2
  stem: "Solve -3x + 4 > 10."
  options:
    A: {text: "x < -2", math: "x < -2"}
    B: {text: "x > -2", math: "x > -2"}
    C: {text: "x > 2", math: "x > 2"}
    D: {text: "x < -14/3", math: "x < Fraction(-14, 3)"}
  key: A
  distractors:
    B: {code: INEQ-FLIP, reveals: "Solved exactly as an equation; did not reverse the inequality after dividing by -3."}
    C: {code: SIGN-DROP, reveals: "Dropped the negative coefficient (3x > 6), so no reversal seemed necessary."}
    D: {code: EQ-TRANSPOSE, reveals: "Reversed correctly but moved +4 across keeping its sign (-3x > 14)."}
  teaching_move: "Test a value (x = -5) in the original and in the proposed answer; derive the reversal from the number line rather than as a rule."
  check: {type: ineq, var: x, original: "-3*x + 4 > 10"}

- id: LIN03
  strand: LIN
  skill: Solve a two-step equation involving division
  ccss: [A-REI.B.3, 7.EE.B.4a]
  naep_focus: equations and inequalities - solving linear equations
  difficulty: 1
  stem: "Solve x/3 + 2 = 5."
  options:
    A: {text: "x = 1", math: "1"}
    B: {text: "x = 13", math: "13"}
    C: {text: "x = 9", math: "9"}
    D: {text: "x = 21", math: "21"}
  key: C
  distractors:
    A: {code: INV-OP, reveals: "Undid division by 3 by dividing by 3 again."}
    B: {code: EQ-ONESIDE, reveals: "Multiplied x/3 and 5 by 3 but not the 2."}
    D: {code: EQ-TRANSPOSE, reveals: "Moved +2 across keeping its sign (x/3 = 7)."}
  teaching_move: "Arrow diagram: x -> divide by 3 -> add 2 -> 5, then undo backwards with the inverse written on each arrow."
  check: {type: solves, var: x, equation: "x/3 + 2 == 5"}

- id: LIN04
  strand: LIN
  skill: Solve an equation with parentheses and the variable on both sides
  ccss: [A-REI.B.3, 8.EE.C.7b]
  naep_focus: equations and inequalities - solving linear equations
  difficulty: 2
  stem: "Solve 3(x - 2) = x + 4."
  options:
    A: {text: "x = 3", math: "3"}
    B: {text: "x = 5", math: "5"}
    C: {text: "x = 5/2", math: "Fraction(5, 2)"}
    D: {text: "There is no solution, because x is on both sides.", math: null}
  key: B
  distractors:
    A: {code: DIST-FIRST, reveals: "Expanded 3(x - 2) as 3x - 2."}
    C: {code: EQ-TRANSPOSE, reveals: "Moved x to the left keeping its sign (3x + x = 10)."}
    D: {code: EQ-BOTHSIDES, reveals: "Believes an unknown on both sides cannot be solved."}
  teaching_move: "Balance model: removing x from both sides keeps the balance level; check the solution by substituting into the original."
  check: {type: solves, var: x, equation: "3*(x - 2) == x + 4"}

- id: LIN05
  strand: LIN
  skill: Solve a literal equation for a variable
  ccss: [A-CED.A.4]
  naep_focus: equations and inequalities - formulas and literal equations
  difficulty: 2
  stem: "The formula d = rt relates distance, rate and time. Which expression gives t?"
  options:
    A: {text: "t = d / r", math: "d / r"}
    B: {text: "t = dr", math: "d * r"}
    C: {text: "t = d - r", math: "d - r"}
    D: {text: "t = r / d", math: "r / d"}
  key: A
  distractors:
    B: {code: INV-OP, reveals: "Moved r to the other side keeping the operation (multiplication) instead of inverting it."}
    C: {code: INV-OP, reveals: "Undid multiplication by subtracting."}
    D: {code: FRAC-ORDER, reveals: "Knows division is needed but divided in the wrong order."}
  teaching_move: "Check with numbers: d = 100 km, r = 50 km/h must give t = 2 h. Which expression gives 2?"
  check: {type: literal, equation: "d == r*t", solve_for: t, vars: [d, r]}

# ---------------------------------------------------------------- NUM: Integers, rational numbers and exponents
- id: NUM01
  strand: NUM
  skill: Apply order of operations with a negative sign and an exponent
  ccss: [8.EE.A.1, N-RN.A.2]
  naep_focus: variables, expressions and operations - order of operations with exponents
  difficulty: 2
  stem: "What is the value of -3²?"
  options:
    A: {text: "9", math: "9"}
    B: {text: "-9", math: "-9"}
    C: {text: "-6", math: "-6"}
    D: {text: "6", math: "6"}
  key: B
  distractors:
    A: {code: EXP-NEG-BASE, reveals: "Squared -3 as a whole: (-3)² instead of -(3²)."}
    C: {code: EXP-MULT, reveals: "Read the exponent as multiplication: -3 · 2."}
    D: {code: EXP-MULT, reveals: "Read the exponent as multiplication and also took the negative as part of the base."}
  teaching_move: "Read -3² aloud as 'the opposite of three squared'; contrast -3² and (-3)² as a worked-example pair."
  check: {type: value, answer: "-3**2"}

- id: NUM02
  strand: NUM
  skill: Substitute a negative value into a polynomial expression
  ccss: [6.EE.A.2c, 7.NS.A.2]
  naep_focus: variables, expressions and operations - evaluating expressions
  difficulty: 2
  stem: "If x = -2, what is the value of x² - 3x?"
  options:
    A: {text: "-2", math: "-2"}
    B: {text: "2", math: "2"}
    C: {text: "-10", math: "-10"}
    D: {text: "10", math: "10"}
  key: D
  distractors:
    A: {code: SIGN-SUB, reveals: "Computed -3 · (-2) as -6, giving 4 - 6."}
    B: {code: EXP-NEG-BASE, reveals: "Substituted without parentheses so x² became -2² = -4, giving -4 + 6."}
    C: {code: EXP-NEG-BASE, reveals: "Both errors: x² as -4 and -3x as -6."}
  teaching_move: "Always substitute negatives inside parentheses: (-2)² - 3(-2). Build the sign rule for multiplication from a pattern."
  check: {type: value, answer: "x**2 - 3*x", at: {x: -2}}

- id: NUM03
  strand: NUM
  skill: Multiply powers with the same base
  ccss: [8.EE.A.1, A-SSE.A.2]
  naep_focus: variables, expressions and operations - properties of exponents
  difficulty: 1
  stem: "Which expression is equivalent to x³ · x⁴?"
  options:
    A: {text: "x⁷", math: "x**7"}
    B: {text: "x¹²", math: "x**12"}
    C: {text: "12x²", math: "12*x**2"}
    D: {text: "2x⁷", math: "2*x**7"}
  key: A
  distractors:
    B: {code: EXP-PRODUCT-MULT, reveals: "Multiplied the exponents (power rule) instead of adding them."}
    C: {code: EXP-MULT, reveals: "Read x³ as 3x and x⁴ as 4x, then multiplied."}
    D: {code: LIKE-TERMS-OP, reveals: "Treated the two powers like added terms, so the 'two x's' became a coefficient of 2."}
  teaching_move: "Expand both as repeated factors and count; derive the product rule and the power rule side by side."
  check: {type: expr, vars: [x], target: "x**3 * x**4"}

- id: NUM04
  strand: NUM
  skill: Evaluate a power with a negative exponent
  ccss: [8.EE.A.1, N-RN.A.1]
  naep_focus: variables, expressions and operations - properties of exponents
  difficulty: 2
  stem: "What is the value of 2⁻³?"
  options:
    A: {text: "-8", math: "-8"}
    B: {text: "-6", math: "-6"}
    C: {text: "1/8", math: "Fraction(1, 8)"}
    D: {text: "1/6", math: "Fraction(1, 6)"}
  key: C
  distractors:
    A: {code: EXP-NEG-EXP, reveals: "Believes a negative exponent makes the value negative."}
    B: {code: EXP-MULT, reveals: "Multiplied base and exponent: 2 · (-3)."}
    D: {code: EXP-MULT, reveals: "Knows a reciprocal is involved but computed 2 · 3 instead of 2³."}
  teaching_move: "Pattern table: 2³ = 8, 2² = 4, 2¹ = 2, 2⁰ = 1 ... each step divides by 2; continue to 2⁻³."
  check: {type: value, answer: "Fraction(2)**-3"}

- id: NUM05
  strand: NUM
  skill: Add algebraic fractions with unlike denominators
  ccss: [A-APR.D.6, 7.NS.A.1]
  naep_focus: variables, expressions and operations - operations with rational expressions
  difficulty: 3
  stem: "Which expression is equivalent to x/3 + x/4?"
  options:
    A: {text: "2x/7", math: "2*x/7"}
    B: {text: "x/7", math: "x/7"}
    C: {text: "7x/12", math: "7*x/12"}
    D: {text: "x²/12", math: "x**2/12"}
  key: C
  distractors:
    A: {code: FRAC-ADD-ACROSS, reveals: "Added numerators and denominators separately."}
    B: {code: FRAC-ADD-ACROSS, reveals: "Added the denominators and kept one numerator."}
    D: {code: FRAC-OP-SWAP, reveals: "Used the multiplication rule (multiply across) for addition."}
  teaching_move: "Check at x = 12 (4 + 3 = 7); rewrite with the unit stated: thirds and quarters become twelfths."
  check: {type: expr, vars: [x], target: "x/3 + x/4"}

# ---------------------------------------------------------------- LINF: Linear functions and rate of change
- id: LINF01
  strand: LINF
  skill: Compute slope from two points
  ccss: [8.EE.B.6, F-IF.B.6]
  naep_focus: patterns, relations and functions - rate of change
  difficulty: 1
  stem: "What is the slope of the line through (2, 5) and (6, 13)?"
  options:
    A: {text: "2", math: "2"}
    B: {text: "1/2", math: "Fraction(1, 2)"}
    C: {text: "-2", math: "-2"}
    D: {text: "8", math: "8"}
  key: A
  distractors:
    B: {code: SLOPE-INVERT, reveals: "Computed change in x over change in y."}
    C: {code: SLOPE-ORDER, reveals: "Subtracted the y-values and x-values in opposite orders."}
    D: {code: SLOPE-INCOMPLETE, reveals: "Used only the change in y."}
  teaching_move: "Define slope as 'change in y when x increases by 1' and read it from a table before using the formula; sketch the points to predict the sign."
  check: {type: value, answer: "Fraction(13 - 5, 6 - 2)"}

- id: LINF02
  strand: LINF
  skill: Identify the y-intercept from slope-intercept form
  ccss: [8.F.B.4, F-IF.C.7a]
  naep_focus: algebraic representations - linear equations and graphs
  difficulty: 1
  stem: "What is the y-intercept of the line y = 3x - 4?"
  options:
    A: {text: "3", math: "3"}
    B: {text: "-4", math: "-4"}
    C: {text: "4", math: "4"}
    D: {text: "4/3", math: "Fraction(4, 3)"}
  key: B
  distractors:
    A: {code: INTERCEPT-COEF, reveals: "Gave the coefficient of x, without knowing which number plays which role."}
    C: {code: SIGN-DROP, reveals: "Identified the right term but dropped its sign."}
    D: {code: INTERCEPT-X, reveals: "Found the x-intercept (where y = 0) instead."}
  teaching_move: "Evaluate at x = 0 and connect the result to where the graph crosses the y-axis."
  check: {type: value, answer: "3*0 - 4"}

- id: LINF03
  strand: LINF
  skill: Interpret the rate of change of a linear model in context
  ccss: [F-LE.B.5, 8.F.B.4]
  naep_focus: patterns, relations and functions - interpreting linear models
  difficulty: 2
  stem: "A phone plan costs C = 15 + 0.10m dollars for m minutes of calls. What does 0.10 represent?"
  options:
    A: {text: "The monthly starting fee", math: null}
    B: {text: "The total cost of m minutes", math: null}
    C: {text: "The number of minutes used", math: null}
    D: {text: "The cost of each minute, in dollars", math: null}
  key: D
  distractors:
    A: {code: RATE-START-SWAP, reveals: "Attached the 'fixed amount' meaning to the rate."}
    B: {code: RATE-TOTAL, reveals: "Confused a per-unit amount with an accumulated amount."}
    C: {code: PARAM-VAR, reveals: "Confused a fixed parameter with the varying quantity."}
  teaching_move: "Write the units of every term (0.10 dollars per minute × m minutes = dollars); compute C(0), C(1), C(2) and ask what changes."
  check:
    type: assert
    truths:
      D: "(15 + Fraction('0.10')*1) - (15 + Fraction('0.10')*0) == Fraction('0.10')"

- id: LINF04
  strand: LINF
  skill: Write a linear equation from a table
  ccss: [8.F.B.4, F-LE.A.2]
  naep_focus: algebraic representations - translating between tables and equations
  difficulty: 2
  stem: "The table shows values of a linear function: x = 0, 1, 2, 3 gives y = 7, 4, 1, -2. Which equation fits the table?"
  options:
    A: {text: "y = 3x + 7", math: "3*x + 7"}
    B: {text: "y = 7x - 3", math: "7*x - 3"}
    C: {text: "y = -3x + 7", math: "-3*x + 7"}
    D: {text: "y = -3x", math: "-3*x"}
  key: C
  distractors:
    A: {code: SLOPE-SIGN, reveals: "Found the size of the change but not its direction (y decreases)."}
    B: {code: RATE-START-SWAP, reveals: "Swapped the starting value and the rate of change."}
    D: {code: PROPORTIONAL-ALL, reveals: "Assumed the relationship is proportional and ignored the starting value."}
  teaching_move: "Before writing any equation, state 'when x = 0, y = __' and 'as x goes up 1, y goes __ by __'."
  check: {type: table, var: x, points: [[0, 7], [1, 4], [2, 1], [3, -2]]}

- id: LINF05
  strand: LINF
  skill: Interpret a segment of a distance-time graph
  ccss: [F-IF.B.4, 8.F.B.5]
  naep_focus: patterns, relations and functions - interpreting graphs in context
  difficulty: 2
  stem: "A graph shows Maya's distance from home, d (km), against time, t (hours). From t = 1 to t = 2 the graph is a horizontal segment at d = 3. What was Maya doing during that hour?"
  options:
    A: {text: "Staying in one place, 3 km from home", math: null}
    B: {text: "Walking along a flat road", math: null}
    C: {text: "Moving at a constant speed of 3 km per hour", math: null}
    D: {text: "Travelling 3 km during that hour", math: null}
  key: A
  distractors:
    B: {code: GRAPH-PICTURE, reveals: "Read the shape of the graph as the shape of the road."}
    C: {code: GRAPH-VARIABLE, reveals: "Read the distance graph as if it showed speed."}
    D: {code: RATE-TOTAL, reveals: "Read the height of the graph (position) as distance travelled during the interval."}
  teaching_move: "Act out distance-time graphs with a walk and narrate each segment; always state what the vertical axis measures."
  check:
    type: assert
    truths:
      A: "Fraction(3 - 3, 2 - 1) == 0"
      C: "Fraction(3 - 3, 2 - 1) == 3"
      D: "3 - 3 == 3"

# ---------------------------------------------------------------- FUNC: Functions and notation
- id: FUNC01
  strand: FUNC
  skill: Evaluate a function given in function notation
  ccss: [F-IF.A.2]
  naep_focus: patterns, relations and functions - function notation
  difficulty: 1
  stem: "If f(x) = x² - 1, what is f(3)?"
  options:
    A: {text: "5", math: "5"}
    B: {text: "4", math: "4"}
    C: {text: "3x² - 3", math: null}
    D: {text: "8", math: "8"}
  key: D
  distractors:
    A: {code: EXP-MULT, reveals: "Read x² as 2x: 2 · 3 - 1."}
    B: {code: ORDER-OPS, reveals: "Subtracted before squaring: (3 - 1)²."}
    C: {code: FN-NOTATION, reveals: "Read f(3) as '3 times the rule' instead of 'the output when the input is 3'."}
  teaching_move: "Write f(□) = □² - 1 with an empty box and put the input in every box."
  check: {type: value, answer: "3**2 - 1"}

- id: FUNC02
  strand: FUNC
  skill: Evaluate a function at an expression input
  ccss: [F-IF.A.2, F-BF.B.3]
  naep_focus: patterns, relations and functions - function notation
  difficulty: 3
  stem: "If f(x) = 2x + 3, which expression is equal to f(x + 1)?"
  options:
    A: {text: "2x + 4", math: "2*x + 4"}
    B: {text: "2x + 5", math: "2*x + 5"}
    C: {text: "2x² + 5x + 3", math: "2*x**2 + 5*x + 3"}
    D: {text: "3x + 4", math: "3*x + 4"}
  key: B
  distractors:
    A: {code: FN-SHIFT, reveals: "Believes adding 1 to the input adds 1 to the output: f(x) + 1."}
    C: {code: FN-NOTATION, reveals: "Multiplied the rule by (x + 1), reading the parentheses as multiplication."}
    D: {code: FN-NOTATION, reveals: "Appended the input to the rule: f(x) + x + 1."}
  teaching_move: "Table of f(x) and f(x + 1) for x = 0, 1, 2; compare f(2 + 1) with f(2) + 1 numerically."
  check: {type: expr, vars: [x], target: "2*(x + 1) + 3"}

- id: FUNC03
  strand: FUNC
  skill: Apply the definition of a function
  ccss: [F-IF.A.1, 8.F.A.1]
  naep_focus: patterns, relations and functions - definition of function
  difficulty: 2
  stem: "In which choice is y a function of x?"
  options:
    A: {text: "{(1, 4), (2, 4), (3, 4)}", math: null}
    B: {text: "{(4, 1), (4, 2), (4, 3)}", math: null}
    C: {text: "x = y²", math: null}
    D: {text: "The line x = 3", math: null}
  key: A
  distractors:
    B: {code: FN-REVERSE, reveals: "Checked that outputs don't repeat instead of checking inputs; may also reject A because its outputs repeat."}
    C: {code: FN-EQUATION, reveals: "Treats any equation as a function."}
    D: {code: FN-LINE, reveals: "Believes every straight line is a function."}
  teaching_move: "Use the language 'one input, one output'; for each choice, find an input with two outputs, or show that none exists."
  check:
    type: assert
    truths:
      A: "is_function([(1,4),(2,4),(3,4)])"
      B: "is_function([(4,1),(4,2),(4,3)])"
      C: "is_function([(4,2),(4,-2),(1,1),(1,-1)])"
      D: "is_function([(3,0),(3,1),(3,2)])"

- id: FUNC04
  strand: FUNC
  skill: Determine the domain of a rational function
  ccss: [F-IF.B.5]
  naep_focus: patterns, relations and functions - domain and range
  difficulty: 2
  stem: "What is the domain of f(x) = 1 / (x - 4)?"
  options:
    A: {text: "All real numbers except 0", math: null}
    B: {text: "All real numbers greater than 4", math: null}
    C: {text: "All real numbers except 4", math: null}
    D: {text: "All real numbers except -4", math: null}
  key: C
  distractors:
    A: {code: DOMAIN-ZERO, reveals: "Remembers 'no dividing by zero' as 'x cannot be zero'."}
    B: {code: DOMAIN-POSITIVE, reveals: "Borrowed the 'must be positive' restriction from square roots."}
    D: {code: SIGN-DROP, reveals: "Solved x - 4 = 0 with a sign error."}
  teaching_move: "Ask 'which input makes the denominator zero?' and solve it; evaluate f(0) and f(3) to show they are defined."
  check:
    type: assert
    truths:
      C: "undefined_at('1/(x-4)', 4) and defined_at('1/(x-4)', 0) and defined_at('1/(x-4)', -4) and defined_at('1/(x-4)', 3)"
      A: "undefined_at('1/(x-4)', 0)"
      B: "undefined_at('1/(x-4)', 3)"
      D: "undefined_at('1/(x-4)', -4)"

- id: FUNC05
  strand: FUNC
  skill: Interpret function notation as an input-output pair
  ccss: [F-IF.A.2, F-IF.A.1]
  naep_focus: patterns, relations and functions - function notation
  difficulty: 1
  stem: "For a function h, h(2) = 7. What does this statement mean?"
  options:
    A: {text: "When the input is 7, the output is 2.", math: null}
    B: {text: "When the input is 2, the output is 7.", math: null}
    C: {text: "h times 2 equals 7, so h = 3.5.", math: null}
    D: {text: "The rule for h is 'add 5'.", math: null}
  key: B
  distractors:
    A: {code: FN-REVERSE, reveals: "Reversed input and output."}
    C: {code: FN-NOTATION, reveals: "Read h(2) as multiplication."}
    D: {code: FN-SINGLEPOINT, reveals: "Inferred a whole rule from a single input-output pair."}
  teaching_move: "Find two different rules that both give h(2) = 7; always label pairs (input, output)."
  check: {type: assert, truths: {}}

# ---------------------------------------------------------------- MOD: Translating words to symbols
- id: MOD01
  strand: MOD
  skill: Write an equation for a multiplicative comparison
  ccss: [A-CED.A.1, A-CED.A.2]
  naep_focus: algebraic representations - writing equations from verbal descriptions
  difficulty: 2
  stem: "At a university there are six times as many students as professors. Let S be the number of students and P the number of professors. Which equation is correct?"
  options:
    A: {text: "6S = P", math: "6*S == P"}
    B: {text: "S = P + 6", math: "S == P + 6"}
    C: {text: "S = 6P", math: "S == 6*P"}
    D: {text: "S · P = 6", math: "S*P == 6"}
  key: C
  distractors:
    A: {code: MOD-REVERSAL, reveals: "Wrote the symbols in word order; S and P are acting as labels, not numbers."}
    B: {code: MOD-ADDITIVE, reveals: "Read 'six times as many' as 'six more than'."}
    D: {code: MOD-KEYWORD, reveals: "Mapped 'times' to multiplying the two letters."}
  teaching_move: "Test with numbers first: 10 professors means 60 students. Which equation is true for S = 60, P = 10?"
  check: {type: relation, scenarios: [{S: 60, P: 10}, {S: 120, P: 20}]}

- id: MOD02
  strand: MOD
  skill: Translate a verbal expression with grouping
  ccss: [6.EE.A.2a, A-SSE.A.1]
  naep_focus: algebraic representations - writing expressions from verbal descriptions
  difficulty: 1
  stem: "Which expression represents 'twice the sum of a number n and 3'?"
  options:
    A: {text: "2n + 3", math: "2*n + 3"}
    B: {text: "2 + n + 3", math: "2 + n + 3"}
    C: {text: "2 · n · 3", math: "2*n*3"}
    D: {text: "2(n + 3)", math: "2*(n + 3)"}
  key: D
  distractors:
    A: {code: MOD-STRUCTURE, reveals: "Translated word by word and missed the grouping implied by 'the sum'."}
    B: {code: MOD-KEYWORD, reveals: "Read 'twice' as 'add 2'."}
    C: {code: MOD-OP-SWAP, reveals: "Read 'sum' as multiplication."}
  teaching_move: "Ask 'what is the last thing you do?' (double) and build the expression from the outside in; test with n = 5."
  check: {type: expr, vars: ["n"], target: "2*(n + 3)"}

- id: MOD03
  strand: MOD
  skill: Represent a percent increase multiplicatively
  ccss: [A-SSE.A.1b, 7.RP.A.3]
  naep_focus: algebraic representations - expressions for percent change
  difficulty: 2
  stem: "The price p of a jacket increases by 20%. Which expression gives the new price?"
  options:
    A: {text: "1.2p", math: "1.2*p"}
    B: {text: "p + 20", math: "p + 20"}
    C: {text: "0.2p", math: "0.2*p"}
    D: {text: "p / 1.2", math: "p / 1.2"}
  key: A
  distractors:
    B: {code: PCT-ABSOLUTE, reveals: "Treated 20% as an amount of 20 dollars."}
    C: {code: PCT-PART-ONLY, reveals: "Computed the increase, not the new price."}
    D: {code: PCT-DIRECTION, reveals: "Sees the multiplicative structure but applied it in the wrong direction."}
  teaching_move: "Double number line with 100% = p; mark 120%. Check with p = $50 and estimate first: the new price must be bigger."
  check: {type: expr, vars: ["p"], target: "p + p*20/100"}

- id: MOD04
  strand: MOD
  skill: Write a linear expression with a fixed amount and a rate
  ccss: [A-CED.A.1, F-LE.A.2]
  naep_focus: algebraic representations - linear models from context
  difficulty: 1
  stem: "A car rental costs $40 plus $25 per day. Which expression gives the total cost, in dollars, for d days?"
  options:
    A: {text: "25 + 40d", math: "25 + 40*d"}
    B: {text: "40 + 25d", math: "40 + 25*d"}
    C: {text: "65d", math: "65*d"}
    D: {text: "40d + 25d", math: "40*d + 25*d"}
  key: B
  distractors:
    A: {code: RATE-START-SWAP, reveals: "Swapped the fixed fee and the daily rate."}
    C: {code: VAR-CONJOIN, reveals: "Added the two amounts and attached d to the total."}
    D: {code: PROPORTIONAL-ALL, reveals: "Applied 'per day' to both amounts."}
  teaching_move: "Ask what it costs for 0, 1 and 2 days before writing anything; label each number with its units."
  check: {type: expr, vars: ["d"], target: "40 + 25*d"}

- id: MOD05
  strand: MOD
  skill: Translate 'less than' correctly
  ccss: [6.EE.A.2a, A-SSE.A.1]
  naep_focus: algebraic representations - writing expressions from verbal descriptions
  difficulty: 1
  stem: "Which expression represents 'three less than twice a number n'?"
  options:
    A: {text: "3 - 2n", math: "3 - 2*n"}
    B: {text: "2(n - 3)", math: "2*(n - 3)"}
    C: {text: "3 < 2n", math: null}
    D: {text: "2n - 3", math: "2*n - 3"}
  key: D
  distractors:
    A: {code: MOD-ORDER-SUB, reveals: "Wrote the subtraction in word order."}
    B: {code: MOD-STRUCTURE, reveals: "Placed the grouping on the wrong part of the phrase."}
    C: {code: MOD-KEYWORD, reveals: "Mapped the words 'less than' to the symbol <."}
  teaching_move: "Numeric translation first ('three less than 10 is 7, so 10 - 3'), then replace 10 with 2n."
  check: {type: expr, vars: ["n"], target: "2*n - 3"}
